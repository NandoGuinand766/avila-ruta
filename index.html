const lab=[],box=[],pr=p=>(S.selP==p.id||(r&&r.stops.includes(p.id)))?0:MAJOR.has(p.id)?1:p.ent?2:p.t=="post"?4:3;

function login(){return `<header><b>ÁVILA RUTA</b></header><main><div class="card" style="margin-top:24px"><h2 style="margin:0 0 4px;font-size:30px">Crea tu cuenta</h2><p class="mu">Para guardar tus subidas, tiempos y retos.</p><input id="nm" placeholder="Nombre"><input id="em" placeholder="Correo electrónico" type="email"><input id="pw" placeholder="Contraseña (mínimo 6 caracteres)" type="password"><p class="err">${S.err||""}</p><button class="btn" style="width:100%" onclick="reg()">Crear cuenta</button></div><p class="mu" style="text-align:center">Mapa real de OpenStreetMap. Amigos, clima y estado de senderos son de ejemplo por ahora.</p></main>`}
function reg(){const n=$("#nm").value.trim(),e=$("#em").value.trim(),p=$("#pw").value;S.err=!n?"Escribe tu nombre.":!/^\S+@\S+\.\S+$/.test(e)?"Correo no válido.":p.length<6?"La contraseña necesita 6 caracteres o más.":"";if(!S.err){S.u=n;save()}render()}
const IC={
map:`<path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20" fill="none"/>`,
list:`<path d="M2.5 19.5l6.5-11 4 6.5 2.5-3.5 6 8z"/><circle cx="17" cy="6" r="1.8"/>`,
clima:`<path d="M7 18.5h10a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7 11.6a3.45 3.45 0 0 0 0 6.9z"/>`,
amigos:`<path d="M15.6 14.4c2.7.2 4.5 2 5 5.1h-4.4"/><circle cx="16.3" cy="8.8" r="2.6"/><circle cx="9" cy="8" r="3.3"/><path d="M2.8 19.5c.6-3.5 3-5.4 6.2-5.4s5.6 1.9 6.2 5.4z"/>`,
perfil:`<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.8-4 3.7-6.3 7.5-6.3s6.7 2.3 7.5 6.3z"/>`};
function render(){const a=$("#app");if(!S.u){a.innerHTML=login();return}
const T=[["map","Mapa"],["list","Rutas"],["clima","Clima"],["amigos","Amigos"],["perfil","Perfil"]];
const v=S.tab=="perfil"&&S.act!=null?actV():S.tab=="amigos"&&S.fr?frV():{map:mapV,list:listV,clima:climaV,amigos:amigosV,perfil:perfilV}[S.tab]();
a.innerHTML=`<header><b>ÁVILA RUTA</b><div class="hb"><button class="wt ${S.dl?"on":""}" onclick="S.dl=S.dl?0:1;S.watch=0;render()" aria-label="Descargar mapa"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5" fill="none"/><path d="M5 19.5h14" fill="none"/></svg>${DL.ok?"Mapa ✓":"Descargar mapa"}</button><button class="wt ${S.watch?"on":""}" onclick="S.watch=!S.watch;S.dl=0;S.imsg='';render()" aria-label="Conectar reloj"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3.5"/><path d="M9 6l.8-3h4.4l.8 3M9 18l.8 3h4.4l.8-3M12 9.5V12l1.8 1.2" fill="none"/></svg>Reloj</button></div></header><main>${v}</main><nav>${T.map(([k,n])=>`<button class="${S.tab==k?"on":""}" onclick="S.rp&&rpEnd(0);S.tab='${k}';S.act=null;S.fr=null;S.msg='';render()"><svg viewBox="0 0 24 24">${IC[k]}</svg>${n}</button>`).join("")}</nav>${S.watch?watchV():""}${S.dl?dlV():""}${S.nv?navV():""}`;
const m=$("#map");if(m)bindMap(m,()=>S.v,v=>Object.assign(S.v,v),drawMap,tapMap);const nm=$("#nmap");if(nm)bindMap(nm,()=>S.nv.v,v=>Object.assign(S.nv.v,v),paintNav)}
// ---------- Descargar mapa: deja todo guardado en el teléfono de una vez ----------
const DLK="avila-ruta-mapa",DL={ok:0,at:0,run:0,st:[],mb:null};try{const x=JSON.parse(localStorage.getItem(DLK)||"null");if(x){DL.ok=1;DL.at=x.at;DL.mb=x.mb}}catch(e){}
const DLS=["App y tipografía","Mapa del Ávila y relieve","113 km de senderos y 99 cruces","Rutas, entradas y destinos","Clima de los 4 puntos"];
async function dlMap(){if(DL.run)return;DL.run=1;DL.st=[];DL.err="";dlPaint();const ok=i=>{DL.st[i]=1;dlPaint()},wait=t=>new Promise(r=>setTimeout(r,t));
try{if("caches" in window&&location.protocol=="https:"){const c=await caches.open("avila-ruta-v2");await c.addAll(["./","index.html","manifest.webmanifest","icon-192.png","icon-512.png"])}ok(0);
 await wait(200);ok(1);await wait(200);ok(2);await wait(200);ok(3);
 for(const x of WXP)await loadWx(x.k,1);DL.st[4]=S.wxe?2:1;
 try{await navigator.storage?.persist()}catch(e){}
 let mb=null;try{const e=await navigator.storage?.estimate();if(e&&e.usage)mb=e.usage/1048576}catch(e){}if(!mb)mb=new Blob([document.documentElement.outerHTML]).size/1048576;
 DL.ok=1;DL.at=Date.now();DL.mb=mb;try{localStorage.setItem(DLK,JSON.stringify({at:DL.at,mb}))}catch(e){}}
catch(e){DL.err=navigator.onLine===false?"Sin señal: conéctate a internet para descargar el mapa.":"No se pudo terminar la descarga. Inténtalo de nuevo."}
DL.run=0;render()}
function dlPaint(){const e=$("#dlp");if(e)e.innerHTML=dlInner()}
function dlInner(){const n=DL.st.filter(Boolean).length;
return `${DLS.map((t,i)=>`<div class="li" style="padding:7px 0;border-bottom:1px solid var(--bd)"><div>${t}</div><span style="font-weight:700;color:${DL.st[i]==2?"var(--mu)":"var(--tx)"}">${DL.st[i]==1?"✓":DL.st[i]==2?"sin señal":DL.run&&i==n?"…":""}</span></div>`).join("")}
<div class="bar" style="margin:12px 0 6px"><i style="width:${(DL.run?n/DLS.length:DL.ok?1:0)*100}%"></i></div>
${DL.err?`<p class="err">${DL.err}</p>`:DL.ok&&!DL.run?`<p style="margin:6px 0;font-weight:600">✓ Listo: puedes usar el mapa, las rutas y la navegación sin señal.</p><p class="mu" style="margin:0">Descargado el ${fdate(DL.at)}${DL.mb?" · "+nf(DL.mb,1)+" MB en el teléfono":""}. El clima queda guardado con la hora en que se descargó.</p>`:""}
<button class="btn" style="width:100%;margin-top:12px" onclick="dlMap()" ${DL.run?"disabled":""}>${DL.run?"Descargando…":DL.ok?"Actualizar descarga":"Descargar mapa"}</button>`}
function dlV(){return `<div class="sh" onclick="DL.run||(S.dl=0,render())"><div class="card" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><div><b class="ttl" style="font-size:26px">Descargar mapa</b><div class="mu">Todo el Ávila en tu teléfono para usarlo sin señal en la montaña</div></div><button class="chip" onclick="S.dl=0;render()">✕</button></div><div id="dlp" style="margin-top:10px">${dlInner()}</div>${OFF.app||!OFF.sw?"":`<p class="mu" style="margin:10px 0 0">Consejo: instala la app en la pantalla de inicio para abrirla sin señal.</p>`}</div></div>`}
// ---------- App instalable: guardar todo en el teléfono para usarlo sin señal ----------
const OFF={ok:0,ev:null,app:matchMedia("(display-mode: standalone)").matches||navigator.standalone};
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function instV(){if(OFF.app||!OFF.sw)return "";return `<div class="card"><b>Instala Ávila Ruta en tu teléfono</b><p class="mu" style="margin:4px 0 10px">${OFF.ok?"✓ El mapa y todas las rutas ya están guardados en este teléfono.":"Guardando el mapa en el teléfono…"} Instálala para abrirla sin señal, como cualquier app.</p>${OFF.ev?`<button class="btn" style="width:100%" onclick="OFF.ev.prompt()">Instalar app</button>`:`<p class="mu" style="margin:0">${IOS?"En Safari: toca Compartir y luego <b>Agregar a pantalla de inicio</b>.":"En Chrome: abre el menú ⋮ y toca <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>."}</p>`}</div>`}
if("serviceWorker" in navigator&&location.protocol=="https:"){OFF.sw=1;navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{OFF.ok=1;try{navigator.storage?.persist()}catch(e){}if(!S.nv)render()}).catch(()=>{OFF.sw=0;render()})}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();OFF.ev=e;if(!S.nv)render()});
addEventListener("appinstalled",()=>{OFF.app=1;if(!S.nv)render()});
FR.forEach(f=>{if(S.frIds)f.f=S.frIds.includes(f.id)?1:0});
render();
if(/[?&]compartido=1/.test(location.search)&&"caches" in window)caches.open("avila-compartido").then(async c=>{const r=await c.match("archivo");history.replaceState(null,"",location.pathname);if(!r||!S.u)return;const b=await r.blob(),n=r.headers.get("x-nombre")||"actividad.fit";await c.delete("archivo");S.watch=1;importFile(new File([b],n))}).catch(()=>{});
</script></body></html>
