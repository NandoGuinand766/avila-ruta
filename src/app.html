</style></head><body><div id="app"></div>
<script>
// Mapa real del Ávila: senderos de OpenStreetMap (© colaboradores de OpenStreetMap, ODbL) y alturas SRTM.
// Coordenadas en metros respecto al origen M.O; M.N = nodos (cruces y puntos), M.E = tramos entre nodos.
const M=/*DATA*/;
const N=M.N,E=M.E,P=M.P,ADJ=N.map(()=>[]);
// tiempo de marcha por tramo: 15 min/km + 1 min por cada 8 m de subida + 1 min por cada 25 m de bajada
E.forEach(e=>{e.tf=e.l/1000*15+e.u/8+e.d/25;e.tb=e.l/1000*15+e.d/8+e.u/25});
E.forEach((e,i)=>{ADJ[e.a].push({e:i,to:e.b,f:1});ADJ[e.b].push({e:i,to:e.a,f:0})});
const ENTS=P.filter(p=>p.ent),DEST=P.filter(p=>!p.ent);
// App nativa (iPhone): GPS con la pantalla bloqueada, Apple Salud, vibración y voz. En la web, estos plugins no existen y se usa lo del navegador.
const CX=window.capacitorExports,NAT=!!(CX&&CX.Capacitor&&CX.Capacitor.isNativePlatform()),PL=n=>NAT?CX.registerPlugin(n):null;
const BG=PL("BackgroundGeolocation"),HAP=PL("Haptics"),AWK=PL("KeepAwake"),TTS=PL("TextToSpeech"),SAL=PL("AvilaSalud");
// vigila la ubicación; bg = seguir con la pantalla bloqueada. ok(coords), ko(1 = sin permiso, otro = sin señal). Devuelve la función para pararla.
function geoWatch(bg,ok,ko){
if(BG){let id=null,dead=0;BG.addWatcher(Object.assign({requestPermissions:true,stale:false,distanceFilter:3},bg?{backgroundTitle:"Ávila Ruta",backgroundMessage:"Guiándote por la ruta"}:{}),(l,e)=>{if(e){ko(e.code=="NOT_AUTHORIZED"?1:2);return}ok({latitude:l.latitude,longitude:l.longitude,accuracy:l.accuracy,altitude:l.altitude,heading:l.bearing,speed:l.speed})}).then(i=>{id=i;if(dead)BG.removeWatcher({id:i})}).catch(()=>ko(2));return()=>{dead=1;if(id!=null)BG.removeWatcher({id})}}
if(!navigator.geolocation){setTimeout(()=>ko(0),0);return()=>{}}
const w=navigator.geolocation.watchPosition(p=>ok(p.coords),e=>ko(e.code),{enableHighAccuracy:true,maximumAge:2000,timeout:30000});return()=>navigator.geolocation.clearWatch(w)}
const TN={peak:"Pico",fall:"Cascada",view:"Mirador",camp:"Campamento",post:"Puesto de guardaparques",hotel:"Hotel y teleférico"};
const $=s=>document.querySelector(s),fm=m=>{m=Math.round(m);return (m>=60?Math.floor(m/60)+" h ":"")+(m%60||m<60?m%60+" min":"").trim()};
const nf=(v,d=0)=>v.toLocaleString("es",{maximumFractionDigits:d,minimumFractionDigits:d,useGrouping:"always"});
const nz=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pn=n=>P.find(p=>nz(p.n).includes(nz(n)));
const ll=(x,y)=>[M.O[1]+y/M.CY,M.O[0]+x/M.CX];
const gmap=p=>`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`;

// ---------- Rutas sobre la red de senderos ----------
const COST={rap:a=>a.f?E[a.e].tf:E[a.e].tb,sub:a=>(a.f?E[a.e].tf:E[a.e].tb)+.25*(a.f?E[a.e].u:E[a.e].d)};
function dj(src,cost){const n=N.length,d=Array(n).fill(Infinity),pv=Array(n).fill(null),u=Array(n).fill(0);d[src]=0;
for(;;){let b=-1;for(let i=0;i<n;i++)if(!u[i]&&d[i]<Infinity&&(b<0||d[i]<d[b]))b=i;if(b<0)break;u[b]=1;
for(const a of ADJ[b]){const c=d[b]+cost(a);if(c<d[a.to]){d[a.to]=c;pv[a.to]={n:b,a}}}}return{d,pv}}
const DJC={};function djc(src,ck){const k=src+ck;return DJC[k]||(DJC[k]=dj(src,COST[ck]))}
function legs(src,dst,cost,ck){if(src==dst)return[];const{d,pv}=ck?djc(src,ck):dj(src,cost);if(d[dst]==Infinity)return null;const st=[];let x=dst;while(x!=src){st.unshift(pv[x].a);x=pv[x].n}return st}
// stops: ids de puntos; rt: ida y vuelta; ck: criterio
function mk(stops,o={}){const ck=o.ck||"rap",cost=o.cost||null;let steps=[];const ns=stops.map(i=>P[i].node);
for(let i=0;i<ns.length-1;i++){const s=legs(ns[i],ns[i+1],cost,cost?null:ck);if(!s)return null;steps=steps.concat(s)}
if(o.rt&&ns.length>1){const s=legs(ns.at(-1),ns[0],cost,cost?null:ck);if(!s)return null;steps=steps.concat(s)}
return build({stops,rt:!!o.rt,ck,n:o.n,steps})}
function build(r){let km=0,up=0,dn=0,t=0;const G=[],C=[];let acc=0;
for(const s of r.steps){const e=E[s.e];km+=e.l;up+=s.f?e.u:e.d;dn+=s.f?e.d:e.u;t+=s.f?e.tf:e.tb;
 const g=s.f?e.g:[...e.g].reverse();g.forEach((p,i)=>{if(G.length&&i==0)return;if(G.length)acc+=Math.hypot(p[0]-G.at(-1)[0],p[1]-G.at(-1)[1]);G.push(p);C.push(acc)})}
if(!G.length){const p=P[r.stops[0]];G.push([p.x,p.y,p.e]);C.push(0)}
Object.assign(r,{km:km/1000,up,dn,t,G,C,L:acc});
r.n=r.n||rname(r);r.id=r.id||rkey(r);
// nodos recorridos con distancia acumulada
let a2=0;const nodes=[{n:P[r.stops[0]].node,s:0}];for(const s of r.steps){a2+=E[s.e].l;nodes.push({n:s.to,s:a2,st:s})}
const k=acc/(a2||1);nodes.forEach(x=>x.s*=k);r.nodes=nodes;
// lugares por los que pasa
r.pass=[];const seen=new Set();nodes.forEach((x,i)=>{for(const p of P)if(p.node==x.n){if(seen.has(p.id)&&!(i==nodes.length-1&&r.rt))continue;seen.add(p.id);r.pass.push({p,s:x.s})}});
// cruces reales (3 o más caminos) donde hay que decidir
r.junc=[];for(let i=1;i<nodes.length-1;i++){const x=nodes[i];if(ADJ[x.n].length>=3)r.junc.push({i,n:x.n,s:x.s,nx:nodes[i+1].st})}
r.d=r.up>1500||r.km>15?3:r.up>900?2:r.up>350?1:0;return r}
const rkey=r=>r.stops.join("-")+(r.rt?"r":"")+r.ck;
function rname(r){const s=r.stops.map(i=>P[i]);if(s.length==2)return s[1].n+(s[0].ent?" desde "+s[0].n:"");return s.slice(1).map(p=>p.n).join(" + ")+(s[0].ent?" desde "+s[0].n:"")}
function bestFrom(dst,ck="rap"){return ENTS.map(e=>({e,d:djc(e.node,ck).d[P[dst].node]})).filter(x=>x.d<Infinity).sort((a,b)=>a.d-b.d)}
// alternativas: más rápida, menos subida y una diferente (penalizando los tramos de la primera)
function options(stops,rt){const out=[],A=mk(stops,{rt,ck:"rap"});if(!A)return out;A.lab="Más rápida";out.push(A);
const B=mk(stops,{rt,ck:"sub"});if(B){B.lab="Menos subida";out.push(B)}
const used=new Set(A.steps.map(s=>s.e));const C=mk(stops,{rt,cost:a=>(used.has(a.e)?4:1)*COST.rap(a)});if(C){C.ck="alt";C.id=rkey(C);C.lab="Por otro camino";out.push(C)}
const ov=(x,y)=>{const s=new Set(y.steps.map(z=>z.e));let c=0,t=0;x.steps.forEach(z=>{t+=E[z.e].l;if(s.has(z.e))c+=E[z.e].l});return c/(t||1)};
return out.filter((r,i)=>r.t<=A.t*1.8&&!out.slice(0,i).some(q=>ov(r,q)>.85&&ov(q,r)>.85))}

// rutas mixtas propuestas (varios destinos en una caminata)
const MX=[
{n:"La Silla completa: Pico Occidental y Pico Oriental",s:["Sabas Nieves","Pico Occidental","Silla de Caracas","Pico Oriental"],rt:1},
{n:"Travesía Humboldt → Silla → Pico Oriental, bajando a Sabas Nieves",s:["Teleférico","Pico Occidental","Pico Oriental","Sabas Nieves"]},
{n:"Pico Naiguatá por Topo Goering y el Anfiteatro",s:["Galindo","Topo Goering","Anfiteatro","Pico Naiguatá"],rt:1},
{n:"Piedra del Indio y Pico Oriental",s:["Cachimbo","Piedra del Indio","Pico Oriental"],rt:1},
{n:"Cascada Quebrada Quintero y mirador El Banquito",s:["Sabas Nieves","Cascada Quebrada Quintero","El Banquito"],rt:1},
{n:"Los Venados y Hotel Humboldt (bajada en teleférico)",s:["Lomas del Viento","Los Venados","Teleférico"]},
{n:"Lagunazo y Pico Occidental desde el Humboldt",s:["Teleférico","Lagunazo","Pico Occidental"],rt:1},
{n:"Cueva de Los Palmeros y la Silla",s:["Chacaíto","Cueva de Los Palmeros","Silla de Caracas"],rt:1}];
const MXR=MX.map(m=>{const ids=m.s.map(n=>pn(n).id);return mk(ids,{rt:m.rt,n:m.n})}).filter(Boolean);
// destinos principales para "Un destino"
const MAIN=["Pico Oriental","Pico Occidental","Pico Naiguatá","Silla de Caracas","Teleférico","Lagunazo","Los Venados","El Banquito","Piedra del Indio","Cascada Quebrada Quintero","Cascada Plantilla","Mirador El Edén","Mirador Anauco","Cueva de Los Palmeros","Topo Goering","Anfiteatro","Puerta de Hércules","Topo Tócome","Rancho Grande","Mirador Boyacá"].map(pn).filter(Boolean);

// ---------- Estado ----------
const S={u:null,tab:"map",rt:"uno",q:"",cn:[pn("Teleférico").id,pn("Pico Oriental").id],cnrt:0,route:null,selP:null,cat:"Todos",all:0,act:null,fr:null,ft:"amigos",msg:"",nv:null,done:[]};
// lo que la persona hace queda guardado en este teléfono (funciona sin señal)
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],MESL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const fdate=ts=>{const d=new Date(ts);return d.getDate()+" "+MES[d.getMonth()]+(d.getFullYear()!=new Date().getFullYear()?" "+d.getFullYear():"")};
const KEY="avila-ruta-v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify({u:S.u,fr:FR.filter(f=>f.f).map(f=>f.id),done:S.done.map(d=>d.imp?{imp:d.imp,ts:d.ts,h:d.h,m:d.m,el:d.el}:({s:d.r.stops,rt:d.r.rt,ck:d.r.ck=="alt"?"rap":d.r.ck,n:d.r.n,ts:d.ts,h:d.h,m:d.m,demo:d.demo?1:0}))}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(!o)return 0;S.u=o.u;S.done=o.done.map(d=>d.imp?{r:trackRoute(d.imp.g,d.imp.n),imp:d.imp,ts:d.ts,h:d.h,m:d.m,el:d.el}:({r:mk(d.s,{rt:d.rt,ck:d.ck,n:d.n}),ts:d.ts||Date.now(),h:d.h,m:d.m,demo:d.demo})).filter(d=>d.r);S.done.forEach(d=>{d.f=fdate(d.ts);if(d.imp)d.r.t=d.m});S.frIds=o.fr;return 1}catch(e){return 0}}
const hoy=()=>{const d=new Date();return{ts:+d,f:fdate(+d),h:d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}};
// historial de ejemplo para la primera vez (se puede borrar desde Perfil > Historial)
function seed(){const ex=[["2026-05-10","6:40",["Sabas Nieves","El Banquito"],1,1.04],["2026-05-24","7:15",["Sabas Nieves","Cascada Quebrada Quintero"],1,.95],["2026-06-14","6:20",["Cachimbo","Piedra del Indio"],1,1.08],["2026-07-05","5:45",["Sabas Nieves","Pico Occidental","Silla de Caracas","Pico Oriental"],1,1.02],["2026-08-02","7:30",["Lomas del Viento","Los Venados"],1,.97],["2026-08-30","8:10",["Teleférico","Lagunazo","Pico Occidental"],1,1],["2026-09-20","6:05",["Sabas Nieves","Pico Oriental"],1,.93],["2026-10-12","7:10",["Sabas Nieves","El Banquito"],1,.99],["2026-10-26","6:30",["Galindo","Pico Naiguatá"],1,1.05]];
 S.done=ex.map(([d,h,st,rt,k])=>{const r=mk(st.map(n=>pn(n).id),{rt}),[H,Mi]=h.split(":").map(Number),ts=+new Date(d+"T00:00:00")+(H*60+Mi)*6e4;return{r,ts,f:fdate(ts),h,m:Math.round(r.t*k),demo:1}})}
if(!load())seed();
const walked=()=>{const s=new Set();S.done.forEach(d=>d.r.steps.forEach(x=>s.add(x.e)));return s};

// ---------- Mapa ----------
const MW=()=>Math.min(window.innerWidth,480);
function fit(G,pad=1.25){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;G.forEach(p=>{a=Math.min(a,p[0]);c=Math.max(c,p[0]);b=Math.min(b,p[1]);d=Math.max(d,p[1])});

const brg=(a,b)=>Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI;
const nrm=a=>((a+540)%360)-180;
function edgeOut(n,a){const g=a.f?E[a.e].g:[...E[a.e].g].reverse();let s=0;for(let i=1;i<g.length;i++){s+=Math.hypot(g[i][0]-g[i-1][0],g[i][1]-g[i-1][1]);if(s>=25||i==g.length-1)return brg(N[n],g[i])}}
function turn(r,j){const inc=r.nodes[j.i].st,ia=ADJ[j.n].find(a=>a.e==inc.e),hin=edgeOut(j.n,ia)+180;
const br=ADJ[j.n].map(a=>({a,rel:nrm(edgeOut(j.n,a)-hin),me:a.e==j.nx.e&&a.to==j.nx.to}));
const back=br.find(b=>b.a.e==inc.e)||br.reduce((m,b)=>Math.abs(b.rel)>Math.abs(m.rel)?b:m,br[0]),me=br.find(b=>b.me);
// instrucción: lado absoluto si no hay otro camino hacia ese lado; si lo hay, "más a la..." o "segundo"
const op=br.filter(b=>b!==back).sort((a,b)=>a.rel-b.rel),sd=x=>x.rel<-25?-1:x.rel>25?1:0,LR=v=>v<0?"izquierda":"derecha";let t;
if(me===back)t="Regresa por el mismo camino";
else if(op.length>=3&&op.indexOf(me)>0&&op.indexOf(me)<op.length-1&&sd(me)==0)t="Toma el camino del medio, recto";
else if(sd(me)==0&&!op.some(x=>x!==me&&sd(x)==0))t="Sigue recto";
else{const v=sd(me)||Math.sign(me.rel),same=op.filter(x=>x!==me&&Math.sign(x.rel)==v);if(!same.length)t="Gira a la "+LR(v);else{const ext=same.every(x=>Math.abs(x.rel)<Math.abs(me.rel));t=ext?"Toma el camino más a la "+LR(v):"Toma el camino suave a la "+LR(v)}}
return{br,back,me,t,n:br.length}}

const pt=(rel,l)=>[c+Math.sin(rel*Math.PI/180)*l,c-Math.cos(rel*Math.PI/180)*l];
T.br.forEach(b=>{if(b===T.me)return;const q=pt(b.rel,R);s+=b===T.back?`<path d="M${c},${c}L${q[0]},${q[1]}" stroke="#FFD400" stroke-width="7" stroke-linecap="round" opacity=".4"/>`:"";if(b===T.back)return;const p=pt(b.rel,R);s+=`<path d="M${c},${c}L${p[0]},${p[1]}" stroke="#555" stroke-width="6" stroke-linecap="round"/>`});

 let last=null,n=0,noGps=0,away=0;

  const pts=R.points.map(p=>{while(j<hr.length-1&&Math.abs(hr[j+1][0]-p[3])<=Math.abs(hr[j][0]-p[3]))j++;const h=hr[j]&&Math.abs(hr[j][0]-p[3])<90e3?Math.round(hr[j][1]):null;return{lat:p[0],lon:p[1],e:p[2],t:p[3],hr:h}});
  try{last=addTrack({pts,timer:0});n++}catch(e){away++;skip.push(w.id)}}
 try{localStorage.setItem("avila-ruta-salud-omitidos",JSON.stringify(skip.slice(-200)))}catch(e){}
 if(!last)throw new Error(noGps?"Tus entrenamientos nuevos no tienen recorrido GPS en Apple Salud":"Tus entrenamientos nuevos no son del Ávila");
 txDone(last,`✓ ${n==1?"Se transfirió 1 caminata":"Se transfirieron "+n+" caminatas"} de Apple Salud`+(away?` · ${away} de otros lugares`:"")+(noGps?` · ${noGps} sin GPS`:""))}

async function importFile(f){S.imsg="";S.tx=1;await step("Recibiendo la actividad…");
try{let name=f.name,buf=await f.arrayBuffer();if(/\.zip$/i.test(name)){const z=await unzip(buf);name=z.name;buf=z.data}
 await step("Leyendo el recorrido GPS…");const raw=/\.fit$/i.test(name)?parseFIT(buf):parseXML(new TextDecoder().decode(buf));if(raw.pts.length<5)throw new Error("El archivo no trae un recorrido GPS");
 await step("Reconociendo los senderos del Ávila…");const d=addTrack(raw);
 txDone(d,"✓ Datos transferidos: "+d.r.pass.length+" lugares reconocidos"+(d.r.hasE?"":" (el archivo no trae altura)"))}
catch(e){S.tx=0;S.imsg="No se pudo transferir: "+(e.message||"archivo no reconocido");render()}}
